[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "streamgrab"
version = "0.3.0"
description = "公开 HLS 地址解析与 N_m3u8DL-RE 下载编排工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StreamGrab contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.45,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
streamgrab = "streamgrab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgrab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
