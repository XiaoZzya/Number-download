[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "number-download"
version = "0.4.0"
description = "Number download：公开 HLS 地址解析与下载编排工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Number download contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "playwright>=1.45,<2",
  "qrcode>=8,<9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nd = "streamgrab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/streamgrab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
